name: Keep Supabase Awake

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (Supabase pauses after 7 days of inactivity)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Send API request to Supabase to generate activity
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/bookings?limit=1")
          echo "Supabase returned HTTP Status Code: $STATUS_CODE"
          if [ "$STATUS_CODE" -ne 200 ] && [ "$STATUS_CODE" -ne 406 ]; then
            echo "Unexpected status code. Database might be paused or down."
            exit 1
          fi
